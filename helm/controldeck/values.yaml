# controlDeck default values.
# Model registration primary path is GitOps: define models under `models:` below
# and deploy via this chart. Dashboard-made live edits are stored as an override
# layer in Postgres and merged at read time — they are never clobbered by a
# Helm upgrade, but Helm always wins on a genuine field conflict (see PRD §6.2, §11).

# Applied to every pod this chart creates. Required when images come from a
# private internal registry, which is the normal case in an air-gapped install.
imagePullSecrets: []
#  - name: internal-registry

router:
  image:
    repository: ghcr.io/epodegrid/controldeck-router
    # Empty means "use the chart's appVersion", so upgrading the chart moves
    # the images with it. Override only to pin a specific build.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2 # HA — router state lives in Postgres, not in-memory (PRD §8)
  port: 4000
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  env:
    ENTRA_TENANT_ID: ""
    ENTRA_JWKS_URI: ""
    ENTRA_AUDIENCE: "api://llm-gateway"
    ENTRA_ISSUER: ""
    STALL_TIMEOUT_MS: "60000"
    QUEUE_TIMEOUT_MS: "300000"
    USE_FAKE_ADAPTERS: "false"

dashboard:
  image:
    repository: ghcr.io/epodegrid/controldeck-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  env:
    # Where the *browser* reaches the router. Server-side rendering uses the
    # in-cluster Service (set automatically from the release name); this one
    # has to be an address the user's browser can resolve, so it is only
    # needed when the browser calls the API directly — the log stream does.
    # Leave empty for a same-origin ingress path.
    NEXT_PUBLIC_API_BASE_URL: ""
    DASHBOARD_ENTRA_CLIENT_ID: ""
    DASHBOARD_ENTRA_TENANT_ID: ""
    DASHBOARD_ADMIN_GROUP_ID: ""

# Mock model fleet.
#
# When enabled, every model's replica Deployment runs the dependency-free
# mock-model image instead of ik_llama.cpp/llama-swap: same OpenAI-compatible
# surface, same readiness endpoint, no weights and no GPU. This is what makes
# the platform deployable to minikube (or any cluster without model hardware)
# for end-to-end testing of routing, queueing, audit and the dashboard.
#
# Never enable this in an environment expected to serve real inference.
mockModels:
  enabled: false
  image:
    repository: ghcr.io/epodegrid/controldeck-mock-model
    tag: ""
    # IfNotPresent so an image side-loaded onto the node (minikube image load,
    # or a build against the node's docker daemon) is used as-is rather than
    # pulled from a registry that may not be reachable.
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Image used by the optional weights-fetch init container.
weightsFetcher:
  image: curlimages/curl:8.10.1

metricsApi:
  enabled: true
  port: 9090
  # Exposes the same underlying data the dashboard shows, for Grafana/Prometheus scrape.
  # Served by the router process at /metrics — no separate deployment needed by default.

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Standard Ingress TLS block, passed through as given:
  #   - hosts: [controldeck.internal.example]
  #     secretName: controldeck-tls
  tls: []
  # `service` selects which backend a path routes to, so the dashboard and the
  # API can share one host and the browser can call the API same-origin.
  hosts:
    - host: controldeck.example.internal
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
        - path: /v1
          pathType: Prefix
          service: router

# KEDA, vendored as a subchart (charts/keda-*.tgz) so no chart repository is
# needed at install time.
#
# Off by default, and that default is the safe one. KEDA is a cluster-scoped
# operator: its CRDs are cluster-wide, two operators reconciling the same
# ScaledObjects conflict, and `helm uninstall controldeck` would remove it from
# every other workload in the cluster that depends on it. Enable it only where
# this chart owns autoscaling cluster-wide — a dedicated cluster, or one where
# nothing else uses KEDA.
#
# The chart refuses to install with this on when a KEDA it does not own is
# already present, rather than quietly running a second operator.
#
# Everything under this key is passed to the KEDA chart itself; see
# https://github.com/kedacore/charts/tree/main/keda for the full set.
keda:
  enabled: false
  # The CRDs are vendored into this chart's crds/ directory instead — see the
  # header of crds/keda-crds.yaml. Two Helm-managed copies of one CRD fight
  # over ownership and fail the install outright, so there must be exactly one
  # owner. Do not turn this back on.
  crds:
    install: false
  # Air-gapped: repoint these at the internal mirror.
  # image:
  #   keda:
  #     repository: ghcr.io/kedacore/keda
  #   metricsApiServer:
  #     repository: ghcr.io/kedacore/keda-metrics-apiserver
  #   webhooks:
  #     repository: ghcr.io/kedacore/keda-admission-webhooks

# Ingress rules for clusters that default-deny traffic between namespaces.
#
# Off by default, because creating a NetworkPolicy where none existed is a
# restriction rather than a permission and would break a working cluster.
# Enable it where a deny-all policy is already in force — the symptom is KEDA's
# HPA showing `<unknown>` for its target while everything inside the namespace
# behaves perfectly.
networkPolicy:
  enabled: false
  # Namespace KEDA runs in. Its metrics apiserver must reach the router's
  # metric endpoint, or the fleet never scales.
  kedaNamespace: keda
  # Namespace of the ingress controller, so the dashboard and API are reachable.
  ingressControllerNamespace: ingress-nginx
  # Anything else, appended verbatim to the ingress rules.
  extraIngress: []
  # Egress rules, for a deny-all that covers egress as well as ingress. Without
  # these the router cannot reach Postgres, its replicas or the Kubernetes API,
  # and crash-loops on start-up.
  egress:
    enabled: false
    # The real Kubernetes API endpoint, not the Service ClusterIP: policy is
    # evaluated after DNAT, so allowing 443 does nothing. From
    #   kubectl get endpoints kubernetes -n default
    apiServer: {}
    #  cidr: 10.0.0.1/32
    #  port: 443
  extraEgress: []

# Postgres is deployed by this chart from the official image rather than by a
# third-party subchart — see templates/postgres.yaml for why.
postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: controldeck
    database: controldeck
    # Used only when existingSecret is empty. Anything set here is rendered
    # into the release manifest stored in the cluster, so prefer the Secret.
    password: controldeck
    # A Secret you create and manage. When set, the chart renders no password
    # of its own and the router assembles its connection string at run time.
    existingSecret: ""
    existingSecretPasswordKey: password
  # Point at an external Postgres (e.g. Azure Database for PostgreSQL) together
  # with postgresql.enabled=false. Defaults to the in-chart StatefulSet.
  host: ""
  persistence:
    enabled: true
    size: 20Gi
    # Unset uses the cluster default, which on a managed cluster is rarely the
    # class you want for a database.
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

# Config-as-code model registration (GitOps base config, PRD §6.2).
# Each entry becomes a row in model_registry on chart install/upgrade via the
# router's startup reconciliation, and drives a per-model KEDA ScaledObject.
models:
  - id: ornith-35b
    name: "Ornith-1.0 35B"
    modelClass: large
    capabilities: [chat, tools]
    minReplicas: 1
    maxReplicas: 6
    costBasis: per_1k_tokens
    costValue: 0.0042
    systemPrompt: "You are a careful, methodical assistant."
    keda:
      # Requests a single replica should absorb; drives
      # ceil(pending / requestsPerReplica) in the HPA.
      requestsPerReplica: 1
      pollingIntervalSeconds: 15
      cooldownSeconds: 300
      # Grow one replica at a time. The metric always asks for demand+1; this
      # governs how quickly that is granted.
      scaleUpPods: 1
      scaleUpPeriodSeconds: 30
      scaleDownPods: 1
      scaleDownPeriodSeconds: 60
      scaleDownStabilizationSeconds: 300
    mock:
      tokensPerSec: 15
      loadDelayMs: 20000
      maxConcurrency: 3
      replyMinTokens: 40
      replyMaxTokens: 120
    llamaSwap:
      image: ghcr.io/your-org/ik-llama-cpp:latest
      modelPath: /models/ornith-1.0-q4_k_m.gguf
      resources:
        requests: { cpu: "4", memory: 40Gi }
        limits: { cpu: "8", memory: 48Gi }
  - id: kestrel-9b
    name: "Kestrel-9B"
    modelClass: fast
    capabilities: [chat, tools]
    minReplicas: 2
    maxReplicas: 8
    costBasis: per_1k_tokens
    costValue: 0.0011
    systemPrompt: "You are a concise assistant. Prefer short, direct answers."
    keda:
      # Requests a single replica should absorb; drives
      # ceil(pending / requestsPerReplica) in the HPA.
      requestsPerReplica: 1
      pollingIntervalSeconds: 15
      cooldownSeconds: 300
      # Grow one replica at a time. The metric always asks for demand+1; this
      # governs how quickly that is granted.
      scaleUpPods: 1
      scaleUpPeriodSeconds: 30
      scaleDownPods: 1
      scaleDownPeriodSeconds: 60
      scaleDownStabilizationSeconds: 300
    mock:
      tokensPerSec: 45
      loadDelayMs: 5000
      maxConcurrency: 4
      replyMinTokens: 12
      replyMaxTokens: 48
    llamaSwap:
      image: ghcr.io/your-org/ik-llama-cpp:latest
      modelPath: /models/kestrel-9b-q4_k_m.gguf
      resources:
        requests: { cpu: "2", memory: 12Gi }
        limits: { cpu: "4", memory: 16Gi }
  - id: lark-vision
    name: "Lark-Vision 2B"
    modelClass: vision
    capabilities: [chat, vision]
    minReplicas: 1
    maxReplicas: 4
    costBasis: per_1k_tokens
    costValue: 0.0019
    systemPrompt: "You can see attached images. Describe what you observe before answering."
    keda:
      # Requests a single replica should absorb; drives
      # ceil(pending / requestsPerReplica) in the HPA.
      requestsPerReplica: 1
      pollingIntervalSeconds: 15
      cooldownSeconds: 300
      # Grow one replica at a time. The metric always asks for demand+1; this
      # governs how quickly that is granted.
      scaleUpPods: 1
      scaleUpPeriodSeconds: 30
      scaleDownPods: 1
      scaleDownPeriodSeconds: 60
      scaleDownStabilizationSeconds: 300
    mock:
      tokensPerSec: 30
      loadDelayMs: 4000
      maxConcurrency: 2
      replyMinTokens: 16
      replyMaxTokens: 60
    llamaSwap:
      image: ghcr.io/your-org/ik-llama-cpp:latest
      modelPath: /models/lark-vision-2b.gguf
      resources:
        requests: { cpu: "1", memory: 6Gi }
        limits: { cpu: "2", memory: 8Gi }
  - id: ember-embed
    name: "Ember-Embed"
    modelClass: embedding
    capabilities: [embeddings]
    minReplicas: 1
    maxReplicas: 3
    costBasis: per_compute_second
    costValue: 0.0003
    systemPrompt: ""
    keda:
      # Requests a single replica should absorb; drives
      # ceil(pending / requestsPerReplica) in the HPA.
      requestsPerReplica: 8
      pollingIntervalSeconds: 15
      cooldownSeconds: 300
      # Embeddings are quick and the replica is cheap, so it may grow faster.
      scaleUpPods: 2
      scaleUpPeriodSeconds: 30
      scaleDownPods: 1
      scaleDownPeriodSeconds: 60
      scaleDownStabilizationSeconds: 300
    mock:
      loadDelayMs: 2000
      maxConcurrency: 8
      embeddingDim: 384
    llamaSwap:
      image: ghcr.io/your-org/ik-llama-cpp:latest
      modelPath: /models/ember-embed.gguf
      resources:
        requests: { cpu: 500m, memory: 2Gi }
        limits: { cpu: "1", memory: 4Gi }
