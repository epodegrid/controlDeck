apiVersion: v2
name: controldeck
description: Self-hosted, OpenAI-API-compatible LLM gateway with Entra ID auth, cost tracking, audit logging, and dynamic autoscaling.
type: application
version: 0.4.1
appVersion: "0.4.1"
home: https://github.com/epodegrid/controlDeck

# KEDA is vendored rather than referenced, so `helm install` needs no chart
# repository at install time — an air-gapped cluster cannot reach one. The
# .tgz in charts/ is committed; refresh it with `helm dependency update`.
#
# Off by default: KEDA is a cluster-scoped operator with cluster-wide CRDs, so
# a second install fights the first, and `helm uninstall controldeck` would
# take it away from every other workload using it. Enable it only where this
# chart owns autoscaling for the cluster.
dependencies:
  - name: keda
    version: "2.20.2"
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
keywords:
  - llm
  - gateway
  - entra-id
  - keda
  - llama-swap
