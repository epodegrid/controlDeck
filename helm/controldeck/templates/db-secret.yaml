# Connection string handed to the router and consumed as DATABASE_URL.
#
# Skipped entirely when postgresql.auth.existingSecret is set: a password that
# must not live in values must not be rendered into a Secret by the chart
# either, since the release manifest is stored in the cluster and is readable
# by anyone who can read Helm's own secrets.
{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controldeck.fullname" . }}-db
type: Opaque
stringData:
  url: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password | default "controldeck" }}@{{ include "controldeck.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
