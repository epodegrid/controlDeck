# Connection string handed to the router and consumed as DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controldeck.fullname" . }}-db
type: Opaque
stringData:
  url: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password | default "controldeck" }}@{{ include "controldeck.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
