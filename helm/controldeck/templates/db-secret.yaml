{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controldeck.fullname" . }}-db
type: Opaque
stringData:
  url: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password | default "changeme" }}@{{ include "controldeck.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
