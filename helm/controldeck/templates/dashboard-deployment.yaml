apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controldeck.fullname" . }}-dashboard
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        # part-of is on the pod, not only on the Deployment: a NetworkPolicy
        # selects pods, and one that matches nothing silently allows nothing —
        # which under a default-deny cluster is indistinguishable from having
        # written no policy at all.
        app.kubernetes.io/part-of: controldeck
        app.kubernetes.io/component: dashboard
    spec:
      {{- with $.Values.imagePullSecrets }}
      # An air-gapped cluster pulls from an internal mirror, which normally
      # requires credentials.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.dashboard.port }}
          env:
            # Next's standalone server binds to $HOSTNAME, which Kubernetes
            # sets to the pod name — so it listens only on the pod IP. Service
            # traffic works, but `kubectl port-forward` connects to the pod's
            # loopback and gets nothing, which is exactly the tool an operator
            # reaches for when something is wrong.
            - name: HOSTNAME
              value: "0.0.0.0"
            # Derived from the release, not hardcoded: the Service is named
            # after the release, so a release called anything but "controldeck"
            # gave the dashboard an address that does not resolve. Server-side
            # rendering talks to the in-cluster Service.
            - name: API_BASE_URL
              value: "http://{{ include "controldeck.fullname" . }}-router.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.router.port }}"
            {{- range $k, $v := .Values.dashboard.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "controldeck.fullname" . }}-dashboard
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: dashboard
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
      name: http
