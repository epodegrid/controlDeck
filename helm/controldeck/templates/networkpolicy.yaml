{{- if .Values.networkPolicy.enabled }}
# Ingress rules for the router, for clusters that default-deny.
#
# A locked-down cluster — the kind this platform is built for — commonly has a
# deny-all NetworkPolicy per namespace. Everything then works except the two
# things that arrive from *outside* the namespace, and both fail silently:
#
#   KEDA's metrics apiserver polls /metrics/keda/:model. Blocked, the HPA shows
#   `<unknown>` for its target and the fleet never scales. Nothing logs an
#   error, because from the router's side no request ever arrived.
#
#   The ingress controller reaches the dashboard and the API. Blocked, the
#   whole thing is simply unreachable, which at least announces itself.
#
# Off by default: a NetworkPolicy in a namespace with no other policies is a
# *restriction*, not a permission, so creating one uninvited would break a
# cluster that was working fine.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "controldeck.fullname" . }}-allow-ingress
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: controldeck
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    # Within the release: router → model replicas, dashboard → router,
    # everything → Postgres.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: controldeck
    {{- with .Values.networkPolicy.kedaNamespace }}
    # KEDA's metrics apiserver, which lives in its own namespace and must reach
    # the router's metric endpoint or nothing scales.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.router.port }}
    {{- end }}
    {{- with .Values.networkPolicy.ingressControllerNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.router.port }}
        - protocol: TCP
          port: {{ $.Values.dashboard.port }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  # Needed only where the cluster's deny-all also covers egress. Without these
  # the router cannot reach Postgres, its model replicas, or the Kubernetes API
  # — it crash-loops on start-up and the rollout never completes, which looks
  # like an image or config fault rather than a network one.
  egress:
    # DNS. The first thing a deny-all breaks and the least obvious: every
    # Service name stops resolving, which surfaces as "no such host" rather
    # than as a network problem.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Within the release: router → Postgres, router → model replicas.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: controldeck
    {{- with .Values.networkPolicy.egress.apiServer }}
    # The Kubernetes API, for pod discovery, pod logs and scaling status.
    #
    # NetworkPolicy is evaluated *after* DNAT, so this cannot be written as the
    # kubernetes Service ClusterIP on 443 — it has to be the real endpoint
    # behind it. Find yours with `kubectl get endpoints kubernetes -n default`.
    # Allowing 443 alone silently does nothing.
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
