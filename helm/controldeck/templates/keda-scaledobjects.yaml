{{- range .Values.models }}
{{- if .backendRef }}
# {{ .id }} is an alias: it is served by {{ .backendRef }}'s container, which
# answers to several names over one set of loaded weights. It gets its own
# registry entry — its own system prompt, cost and advertised capabilities —
# but no workload, no Service and no ScaledObject of its own. Giving it those
# would run a second copy of the same model for nothing, and would split the
# scaling signal across two HPAs contending for the same pods.
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .id }}-replica
  labels:
    app.kubernetes.io/part-of: controldeck
    app.kubernetes.io/component: model-replica
    controldeck.io/model-id: {{ .id }}
spec:
  replicas: {{ .minReplicas }}
  selector:
    matchLabels:
      controldeck.io/model-id: {{ .id }}
  template:
    metadata:
      labels:
        controldeck.io/model-id: {{ .id }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      # An air-gapped cluster pulls from an internal mirror, which normally
      # requires credentials.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # A replica that is scaled down must be allowed to finish what it is
      # already generating (§6.5: requests making progress are never cut off).
      # The preStop sleep holds the container open long enough for the router's
      # next reconcile to notice the pod is terminating and stop placing on it,
      # and the grace period then covers a generation already in flight.
      terminationGracePeriodSeconds: {{ .drainSeconds | default 120 }}
      {{- with .nodeSelector }}
      # Model images are often built per micro-architecture (e.g. separate
      # zen4/zen5 tags). Placing them on a node pool that matches is not an
      # optimisation — a mismatched build fails at start-up with an illegal
      # instruction.
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- if and (not ((kindIs "bool" .useMock) | ternary .useMock $.Values.mockModels.enabled)) .llamaSwap.weightsUrl }}
      # Weights are fetched into an emptyDir before the server starts. In a real
      # deployment these usually arrive on a PersistentVolume — set weightsUrl
      # only where pulling at start-up is acceptable, since an air-gapped
      # cluster cannot reach a model hub at all.
      initContainers:
        - name: fetch-weights
          image: {{ $.Values.weightsFetcher.image | default "curlimages/curl:8.10.1" }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -f "{{ .llamaSwap.modelPath }}" ]; then
                echo "weights already present"; exit 0
              fi
              mkdir -p "$(dirname {{ .llamaSwap.modelPath }})"
              echo "fetching weights"
              curl -fsSL -o "{{ .llamaSwap.modelPath }}" "{{ .llamaSwap.weightsUrl }}"
              ls -lh "{{ .llamaSwap.modelPath }}"
          volumeMounts:
            - { name: models, mountPath: /models }
      {{- end }}
      containers:
      {{- /* Per-model override, so a real model server can run alongside mocks —
             a common development shape when only one model's weights are
             available locally. Falls back to the global switch. */}}
      {{- if (kindIs "bool" .useMock) | ternary .useMock $.Values.mockModels.enabled }}
        # Mock fleet: same HTTP surface and readiness contract as llama-swap,
        # no weights. See mockModels in values.yaml.
        - name: mock-model
          image: "{{ $.Values.mockModels.image.repository }}:{{ $.Values.mockModels.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.mockModels.image.pullPolicy }}
          env:
            # The mock fleet's container is the chart's own, so a non-default
            # port has to be passed to it. A real model image carries its
            # listen port in its own config, which is why `port` is otherwise
            # descriptive — it tells the router where to reach the container,
            # it does not configure the container.
            - name: PORT
              value: {{ .port | default 8080 | quote }}
            - name: MODEL_ID
              value: {{ .id | quote }}
            - name: CAPABILITIES
              value: {{ join "," .capabilities | quote }}
            {{- with .mock }}
            {{- if .tokensPerSec }}
            - name: TOKENS_PER_SEC
              value: {{ .tokensPerSec | quote }}
            {{- end }}
            {{- if .loadDelayMs }}
            - name: LOAD_DELAY_MS
              value: {{ .loadDelayMs | quote }}
            {{- end }}
            {{- if .maxConcurrency }}
            - name: MAX_CONCURRENCY
              value: {{ .maxConcurrency | quote }}
            {{- end }}
            {{- if .replyMinTokens }}
            - name: REPLY_MIN_TOKENS
              value: {{ .replyMinTokens | quote }}
            {{- end }}
            {{- if .replyMaxTokens }}
            - name: REPLY_MAX_TOKENS
              value: {{ .replyMaxTokens | quote }}
            {{- end }}
            {{- if .embeddingDim }}
            - name: EMBEDDING_DIM
              value: {{ .embeddingDim | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .port | default 8080 }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .port | default 8080 }} }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .preStopSeconds | default 15 }}"]
          resources:
            {{- toYaml $.Values.mockModels.resources | nindent 12 }}
      {{- else }}
        - name: llama-swap
          image: {{ .llamaSwap.image }}
          {{- with .llamaSwap.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .llamaSwap.modelPath .llamaSwap.env }}
          env:
            {{- with .llamaSwap.modelPath }}
            # Only for images that take the weights path at runtime. A container
            # that ships its own llama-swap config.yaml (weights baked in or
            # mounted at a fixed path) needs nothing here.
            - name: MODEL_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .llamaSwap.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .port | default 8080 }}
          readinessProbe:
            # NOTE: this gates on the *proxy* being up, not on weights being
            # loaded. Plain llama.cpp holds /health non-200 until the model is
            # ready, but llama-swap answers 200 "OK" as soon as its own process
            # starts — it loads a model on demand, on the first request that
            # names it, so there is nothing to be ready for beforehand.
            #
            # The wait for weights is therefore absorbed on the request path
            # instead, by the model's firstTokenTimeoutMs allowance. Do not
            # "tighten" this into a model-readiness gate: with llama-swap the
            # pod would simply never become ready.
            httpGet: { path: /health, port: {{ .port | default 8080 }} }
            periodSeconds: 5
            failureThreshold: 60
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .preStopSeconds | default 15 }}"]
          resources:
            {{- toYaml .llamaSwap.resources | nindent 12 }}

          {{- if .llamaSwap.weightsUrl }}
          volumeMounts:
            - { name: models, mountPath: /models }
          {{- end }}
      {{- if .llamaSwap.weightsUrl }}
      volumes:
        - name: models
          emptyDir: {}
      {{- end }}
      {{- end }}
---
# Stable in-cluster address for this model's replicas. The router resolves a
# model's endpoint_url to this Service; kube-proxy spreads across ready pods,
# and unready pods (still loading weights) are excluded from Endpoints, which
# is what enforces the readiness gating of PRD §6.4 at the network layer.
apiVersion: v1
kind: Service
metadata:
  name: {{ .id }}
  labels:
    app.kubernetes.io/part-of: controldeck
    app.kubernetes.io/component: model-replica
    controldeck.io/model-id: {{ .id }}
spec:
  selector:
    controldeck.io/model-id: {{ .id }}
  ports:
    - port: 80
      targetPort: {{ .port | default 8080 }}
      name: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .id }}-scaledobject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .id }}-replica
  minReplicaCount: {{ .minReplicas }}
  maxReplicaCount: {{ .maxReplicas }}
  {{- if eq (int .minReplicas) 0 }}
  # Both of these apply only to the scale-to-zero path, and KEDA warns on every
  # apply if they are set when minReplicaCount > 0. Emitted only when they mean
  # something, so `kubectl apply` stays quiet and the manifest says what is
  # actually in effect. Above zero, the HPA polls the external metric on its own
  # schedule and scale-down is governed by the behavior policies below.
  #
  # pollingInterval: how often KEDA asks the router for the current figure.
  pollingInterval: {{ .keda.pollingIntervalSeconds | default 15 }}
  # cooldownPeriod: how long the last replica must stay unneeded before it is
  # removed. Generous, because reloading model weights is expensive and trading
  # idle RAM for not paying that cost repeatedly is the right way round (§6.4).
  cooldownPeriod: {{ .keda.cooldownSeconds | default 300 }}
  {{- end }}
  triggers:
    - type: metrics-api
      metadata:
        # Fully qualified on purpose. The KEDA operator runs in its own
        # namespace and resolves this URL from there, so a bare Service name
        # is "no such host" — the ScaledObject reports Ready, the HPA reports
        # FailedGetExternalMetric, and nothing ever scales.
        url: "http://{{ include "controldeck.fullname" $ }}-router.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.router.port }}/metrics/keda/{{ .id }}"
        valueLocation: "pending_requests"
        # The HPA computes ceil(pending_requests / targetValue), so this is how
        # many pending requests one replica is expected to absorb. It must
        # match what the replica can actually serve concurrently — one, for a
        # generation-bound model — or the fleet is sized wrongly in whichever
        # direction the number is off.
        targetValue: "{{ .keda.requestsPerReplica | default 1 }}"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # The metric asks for demand+1 immediately, which on a burst would
          # mean provisioning several replicas at once. These policies cap how
          # fast that request is honoured, so the fleet grows in steps: a model
          # replica has to load its weights and may need a node provisioned
          # underneath it, and starting six of those simultaneously thrashes
          # the cluster autoscaler for capacity that arrives too late to help
          # the burst that asked for it.
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: {{ .keda.scaleUpPods | default 1 }}
              periodSeconds: {{ .keda.scaleUpPeriodSeconds | default 30 }}
        scaleDown:
          # Slow on the way down. Reloading weights is the expensive operation,
          # and an idle replica costs little but RAM on this cost model (§6.4),
          # so the asymmetry is deliberate.
          stabilizationWindowSeconds: {{ .keda.scaleDownStabilizationSeconds | default 300 }}
          policies:
            - type: Pods
              value: {{ .keda.scaleDownPods | default 1 }}
              periodSeconds: {{ .keda.scaleDownPeriodSeconds | default 60 }}
{{- end }}
{{- end }}
