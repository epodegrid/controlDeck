{{- range .Values.models }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .id }}-replica
  labels:
    app.kubernetes.io/part-of: controldeck
    app.kubernetes.io/component: model-replica
    controldeck.io/model-id: {{ .id }}
spec:
  replicas: {{ .minReplicas }}
  selector:
    matchLabels:
      controldeck.io/model-id: {{ .id }}
  template:
    metadata:
      labels:
        controldeck.io/model-id: {{ .id }}
    spec:
      containers:
      {{- if $.Values.mockModels.enabled }}
        # Mock fleet: same HTTP surface and readiness contract as llama-swap,
        # no weights. See mockModels in values.yaml.
        - name: mock-model
          image: "{{ $.Values.mockModels.image.repository }}:{{ $.Values.mockModels.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.mockModels.image.pullPolicy }}
          env:
            - name: MODEL_ID
              value: {{ .id | quote }}
            - name: CAPABILITIES
              value: {{ join "," .capabilities | quote }}
            {{- with .mock }}
            {{- if .tokensPerSec }}
            - name: TOKENS_PER_SEC
              value: {{ .tokensPerSec | quote }}
            {{- end }}
            {{- if .loadDelayMs }}
            - name: LOAD_DELAY_MS
              value: {{ .loadDelayMs | quote }}
            {{- end }}
            {{- if .maxConcurrency }}
            - name: MAX_CONCURRENCY
              value: {{ .maxConcurrency | quote }}
            {{- end }}
            {{- if .replyMinTokens }}
            - name: REPLY_MIN_TOKENS
              value: {{ .replyMinTokens | quote }}
            {{- end }}
            {{- if .replyMaxTokens }}
            - name: REPLY_MAX_TOKENS
              value: {{ .replyMaxTokens | quote }}
            {{- end }}
            {{- if .embeddingDim }}
            - name: EMBEDDING_DIM
              value: {{ .embeddingDim | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.mockModels.resources | nindent 12 }}
      {{- else }}
        - name: llama-swap
          image: {{ .llamaSwap.image }}
          env:
            - name: MODEL_PATH
              value: {{ .llamaSwap.modelPath }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          resources:
            {{- toYaml .llamaSwap.resources | nindent 12 }}
      {{- end }}
---
# Stable in-cluster address for this model's replicas. The router resolves a
# model's endpoint_url to this Service; kube-proxy spreads across ready pods,
# and unready pods (still loading weights) are excluded from Endpoints, which
# is what enforces the readiness gating of PRD §6.4 at the network layer.
apiVersion: v1
kind: Service
metadata:
  name: {{ .id }}
  labels:
    app.kubernetes.io/part-of: controldeck
    app.kubernetes.io/component: model-replica
    controldeck.io/model-id: {{ .id }}
spec:
  selector:
    controldeck.io/model-id: {{ .id }}
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .id }}-scaledobject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .id }}-replica
  minReplicaCount: {{ .minReplicas }}
  maxReplicaCount: {{ .maxReplicas }}
  # How often KEDA asks the router for the current figure.
  pollingInterval: {{ .keda.pollingIntervalSeconds | default 15 }}
  # How long a replica must stay unneeded before it is removed. Generous by
  # default: reloading model weights is expensive, so trading a little idle
  # RAM for not paying that cost repeatedly is the right way round (§6.4).
  cooldownPeriod: {{ .keda.cooldownSeconds | default 300 }}
  triggers:
    - type: metrics-api
      metadata:
        url: "http://{{ include "controldeck.fullname" $ }}-router:{{ $.Values.router.port }}/metrics/keda/{{ .id }}"
        valueLocation: "pending_requests"
        # The HPA computes ceil(pending_requests / targetValue), so this is how
        # many pending requests one replica is expected to absorb. It must
        # match what the replica can actually serve concurrently — one, for a
        # generation-bound model — or the fleet is sized wrongly in whichever
        # direction the number is off.
        targetValue: "{{ .keda.requestsPerReplica | default 1 }}"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # The metric asks for demand+1 immediately, which on a burst would
          # mean provisioning several replicas at once. These policies cap how
          # fast that request is honoured, so the fleet grows in steps: a model
          # replica has to load its weights and may need a node provisioned
          # underneath it, and starting six of those simultaneously thrashes
          # the cluster autoscaler for capacity that arrives too late to help
          # the burst that asked for it.
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: {{ .keda.scaleUpPods | default 1 }}
              periodSeconds: {{ .keda.scaleUpPeriodSeconds | default 30 }}
        scaleDown:
          # Slow on the way down. Reloading weights is the expensive operation,
          # and an idle replica costs little but RAM on this cost model (§6.4),
          # so the asymmetry is deliberate.
          stabilizationWindowSeconds: {{ .keda.scaleDownStabilizationSeconds | default 300 }}
          policies:
            - type: Pods
              value: {{ .keda.scaleDownPods | default 1 }}
              periodSeconds: {{ .keda.scaleDownPeriodSeconds | default 60 }}
{{- end }}
