{{- if .Values.postgresql.enabled }}
# Postgres, deployed from the official image rather than a third-party chart.
#
# This replaced a Bitnami subchart dependency. Bitnami withdrew their public
# Docker Hub images, so `helm install` failed at the pull with
# ImagePullBackOff — the chart could not be installed at all. Beyond that
# breakage, an external chart repository is a poor fit for a platform whose
# premise is running with no outbound access (PRD §8): a subchart resolved at
# deploy time is one more thing to mirror, and one more thing that can be
# withdrawn from under a release.
#
# All persistent state lives here — audit, cost history and the shared router
# state that lets the router run multiple replicas (§7, §8).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controldeck.fullname" . }}-postgres
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | default "controldeck" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "controldeck.fullname" . }}-postgres
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "controldeck.fullname" . }}-postgres
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "controldeck.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image | default "postgres:16-alpine" }}
          envFrom:
            - secretRef:
                name: {{ include "controldeck.fullname" . }}-postgres
          env:
            # The official image refuses to initialise into a non-empty mount
            # point, and a PVC arrives with lost+found already in it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.auth.username }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml (.Values.postgresql.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}
