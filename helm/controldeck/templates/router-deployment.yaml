apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controldeck.fullname" . }}-router
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        # part-of is on the pod, not only on the Deployment: a NetworkPolicy
        # selects pods, and one that matches nothing silently allows nothing —
        # which under a default-deny cluster is indistinguishable from having
        # written no policy at all.
        app.kubernetes.io/part-of: controldeck
        app.kubernetes.io/component: router
    spec:
      {{- with $.Values.imagePullSecrets }}
      # An air-gapped cluster pulls from an internal mirror, which normally
      # requires credentials.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Grants read access to pods and pod logs; see router-rbac.yaml.
      serviceAccountName: {{ include "controldeck.fullname" . }}-router
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.router.port }}
          env:
            - name: PORT
              value: "{{ .Values.router.port }}"
            {{- if .Values.postgresql.auth.existingSecret }}
            # Assembled here rather than stored, so the password exists only in
            # the Secret you manage. Kubernetes expands $(VAR) against earlier
            # entries in this same list.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.existingSecretPasswordKey | default "password" }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(PGPASSWORD)@{{ .Values.postgresql.host | default (printf "%s-postgres" (include "controldeck.fullname" .)) }}:5432/{{ .Values.postgresql.auth.database }}"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "controldeck.fullname" . }}-db
                  key: url
            {{- end }}
            {{- range $k, $v := .Values.router.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # Talk to model backends over real HTTP. The in-process fake exists
            # only for unit tests; a deployed router always uses the wire.
            - name: MODEL_BACKEND
              value: "http"
            # The namespace this router runs in, so pod discovery and the log
            # tail do not have to read it off disk.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The API server presents a certificate signed by the cluster CA,
            # which Node does not trust out of the box — every call fails with
            # a bare "fetch failed" that names neither TLS nor the CA. The CA
            # is mounted with the service account token; this makes Node use it.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # One endpoint per registered model, resolved to the per-model
            # Service created alongside each replica Deployment. Consumed by
            # the seed/registry via MODEL_ENDPOINT_<UPPER_SNAKE_ID>.
            {{- range .Values.models }}
            - name: MODEL_ENDPOINT_{{ .id | upper | replace "-" "_" }}
              value: "http://{{ .id }}"
            {{- end }}
          {{- if .Values.models }}
          volumeMounts:
            - name: models-config
              mountPath: /etc/controldeck
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.router.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.router.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
      {{- if .Values.models }}
      volumes:
        - name: models-config
          configMap:
            name: {{ include "controldeck.fullname" . }}-models
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "controldeck.fullname" . }}-router
  labels:
    {{- include "controldeck.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: router
  ports:
    - port: {{ .Values.router.port }}
      targetPort: {{ .Values.router.port }}
      name: http
