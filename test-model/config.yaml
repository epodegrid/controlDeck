# llama-swap config, deliberately shaped like the production fleet's
# (epodegrid/model-containers) rather than like something convenient to test.
#
# Every setting here exists because it changed the wire behaviour of a request
# and cost us a bug:
#
#   sendLoadingState      streams a progress banner as reasoning_content while
#                         weights load. Indistinguishable from a thinking
#                         model's output except that the frames carry no id.
#   includeAliasesInList  puts aliases and setParamsByID variants into
#                         /v1/models, which is what the router's upstream-name
#                         verification reads.
#   logToStdout: both     without it llama-swap discards the model process's
#                         output and the container emits only proxy lines, so
#                         a log tail shows nothing.
#   --jinja               required for tool calling and for the thinking
#                         template that produces reasoning_content.
#   --parallel 1          one request at a time per replica, so queueing and
#                         the scaling metric behave as they do in production.
#   --ctx-size 32768      a real agent client's system prompt plus its tool
#                         definitions is large: opencode sends ~7.2k tokens
#                         before the user has typed anything. At 4096 every
#                         request failed the context check, which is a fair
#                         test of the error path and a useless one for
#                         everything else.
healthCheckTimeout: 300
logLevel: info
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true
logToStdout: both

models:
  "tiny":
    proxy: "http://127.0.0.1:9999"
    cmd: >
      /app/llama-server
      --model /models/tiny.gguf
      --alias tiny
      --port 9999
      --parallel 1
      --jinja
      --ctx-size 32768
      --temp 0.7 --top-p 0.8
    aliases:
      - "tiny"
      - "Qwen3-0.6B"
    filters:
      setParamsByID:
        # Exercises the alias-of-a-variant shape: the gateway offers these as
        # separate models sharing one container, via backendRef.
        "${MODEL_ID}:thinking":
          temperature: 0.6
        "${MODEL_ID}:instruct":
          temperature: 0.7
          # Qwen3 thinks by default, so without this the variant spends its
          # whole budget reasoning and returns no answer. The production fleet
          # disables thinking on its own :instruct variants the same way.
          chat_template_kwargs:
            enable_thinking: false
